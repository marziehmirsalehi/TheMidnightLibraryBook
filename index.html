<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *,
        *::before,
        *::after {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: rgb(243, 242, 220);
        }

        .book {
            width: 400px;
            height: 600px;
            margin: 200px auto;
            position: relative;
            transform: perspective(900px) translate(-40deg);
            transition: 5s;
            transform-style: preserve-3d;

            &:hover {
                transform: perspective(800px) rotateY(-180deg);
            }

            * {
                height: 100%;
                position: absolute;
            }

            >img {
                width: 100%;

                top: 0;
                left: 0;

                &:nth-of-type(2) {
                    transform: translateZ(-98px) scaleX(-1);

                }
            }

            >div {
                &:nth-of-type(1) {
                    top: 0;
                    left: 87.5%;
                    width: 100px;
                    background-color: rgb(36, 30, 48);
                    transform: translateZ(-50px) rotateY(-90deg);
                }
                                &:nth-of-type(2) {
                    top: 0;
                    left: -12%;
                    width: 100px;
                    background-image: repeating-linear-gradient(to right ,black 1%,white 2%);
                    transform: translateZ(-50px) rotateY(-90deg);
                }
            }
        }
    </style>
</head>

<body>
    <div class="book">
        <img src="assets/ketabkhane-2-scaled.jpg" alt="">
        <img src="assets/ketabkhane-scaled.jpg" alt="">
        <div></div>
        <div></div>
    </div>
</body>

</html>
